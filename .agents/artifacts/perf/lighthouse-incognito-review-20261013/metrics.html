<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;color:var(--foreground);font-family:var(--font-sans);background:var(--background)}
table{width:100%;border-collapse:collapse;font-size:var(--font-size-base,14px);line-height:1.45}
th,td{padding:10px 4px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
th{font-weight:500}th:first-child,td:first-child{text-align:left;width:52%}
caption{text-align:left;color:var(--muted-foreground);font-size:12px;padding:0 0 8px}
.focus{background:var(--accent-surface,var(--muted))}
@media(max-width:420px){th,td{padding:9px 3px}th:first-child,td:first-child{width:48%}}
</style></head><body><table aria-label="Desktop and mobile Lighthouse metrics from the supplied reports">
<caption>Lighthouse 13.4.1 · Mobile uses simulated 4× CPU slowdown</caption>
<thead><tr><th scope="col">Metric</th><th scope="col">Desktop</th><th scope="col">Mobile</th></tr></thead>
<tbody>
<tr><th scope="row">Performance score</th><td>99 / 100</td><td>97 / 100</td></tr>
<tr><th scope="row">First contentful paint</th><td>0.38 s</td><td>1.26 s</td></tr>
<tr><th scope="row">Largest contentful paint</th><td>0.60 s</td><td>1.67 s</td></tr>
<tr><th scope="row">Total blocking time</th><td>0 ms</td><td>105 ms</td></tr>
<tr><th scope="row">Layout shift</th><td>0</td><td>0</td></tr>
<tr class="focus"><th scope="row">Speed Index</th><td>0.97 s</td><td>4.15 s</td></tr>
</tbody></table></body></html>
