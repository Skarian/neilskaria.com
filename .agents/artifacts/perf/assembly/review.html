<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonsai transfer comparison</title><style>body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground,#eee);background:var(--background,#16181b)}p{line-height:1.5;margin:0 0 20px}figure{margin:0}.row{margin:0 0 22px}.label{display:flex;justify-content:space-between;gap:16px;font-size:14px;margin-bottom:9px}.track{height:25px;background:var(--secondary,#292e35);border-radius:5px;overflow:hidden}.bar{height:25px;border-radius:5px}.current{width:49.27%;background:var(--chart-2,#58b8a9)}.tree{width:100%;background:var(--chart-4,#df9f60)}.note{font-size:12px;color:var(--muted-foreground,#aab0b8);line-height:1.5;margin:4px 0 0}.number{white-space:nowrap;font-variant-numeric:tabular-nums}strong{font-weight:650}</style><body><figure aria-label="Payload comparison: current full page 2.03 megabytes, additional finished bonsai data 4.12 megabytes"><p><strong>The finished tree costs more to download than today's whole page.</strong></p><div class="row"><div class="label"><span>Current full page transfer</span><span class="number">2.03 MB</span></div><div class="track"><div class="bar current"></div></div></div><div class="row"><div class="label"><span>Additional finished bonsai data</span><span class="number">4.12 MB</span></div><div class="track"><div class="bar tree"></div></div></div><figcaption class="note">Current page: existing cold-load profile. Tree: today's geometry and trimming metadata, compressed with Brotli in memory. At the profiled connection, that extra data alone needs about 20.6 seconds of transfer. This is a size experiment, not a shipped implementation.</figcaption></figure></body></html>
